name: Safety regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Static shell analysis
        run: shellcheck -x macos-camera-fix.sh Run.command tests/run.sh
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bash syntax
        run: /bin/bash -n macos-camera-fix.sh && /bin/bash -n Run.command && /bin/bash -n tests/run.sh
      - name: Isolated safety tests (no sudo, no real preference writes)
        run: /bin/bash tests/run.sh
      - name: Public repository privacy scan
        run: |
          if git ls-files | grep -E '\.(plist|log)$|(^|/)(backups|diagnostics)/'; then
            echo 'Private diagnostic or backup files must not be committed.'
            exit 1
          fi
